name: Update dashboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Review history is kept in GitHub's private cache, not in the public repository
      - name: Restore review history
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: review-state-${{ github.run_id }}
          restore-keys: review-state-

      # Output is kept out of the public log; only the last lines are shown if something fails
      - name: Pull latest numbers from Luma
        run: |
          python sync_luma.py > sync.log 2>&1 || (tail -n 5 sync.log; exit 1)
          echo "Numbers updated."
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}

      - name: Save review history
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: review-state-${{ github.run_id }}

      # Removes the numbers that earlier versions saved in the public repository
      - name: Remove old public data files
        continue-on-error: true
        run: |
          if git ls-files --error-unmatch dashboard.json state.json >/dev/null 2>&1 || git ls-files | grep -qE '^(dashboard|state)\.json$'; then
            git config user.name "dashboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm --cached --ignore-unmatch dashboard.json state.json
            git commit -m "Stop storing dashboard numbers in the repository"
            git pull --rebase && git push
          fi

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html dashboard.json site/

      - name: Publish to Cloudflare (private, behind login)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=one27-dashboard --branch=main --commit-dirty=true
